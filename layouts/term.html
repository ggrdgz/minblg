{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ range .Pages }}
  <div class="term">
    <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
    {{ $dateMachine := .Date | time.Format "2006-01-02-T15:04:05Z" }}
    {{ $dateHuman := .Date | time.Format ":date_medium" }}
    <time datetime="{{ $dateMachine }}">{{ $dateHuman }}</time>
  </div>
  {{ end }}
{{ end }}
